services:
  app:
    image: "${LAPARIN_IMAGE:?Set LAPARIN_IMAGE}:${LAPARIN_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "${LAPARIN_BIND_IP:-127.0.0.1}:${LAPARIN_PORT:?Set LAPARIN_PORT}:80"
    environment:
      APP_NAME: Laparin
      APP_ENV: "${LAPARIN_APP_ENV:-production}"
      APP_KEY: "${LAPARIN_APP_KEY:?Set LAPARIN_APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${LAPARIN_APP_URL:?Set LAPARIN_APP_URL}"
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${LAPARIN_DB_NAME:?Set LAPARIN_DB_NAME}"
      DB_USERNAME: "${LAPARIN_DB_USER:-laparin}"
      DB_PASSWORD: "${LAPARIN_DB_PASSWORD:?Set LAPARIN_DB_PASSWORD}"
      SESSION_DRIVER: database
      SESSION_COOKIE: "laparin_${LAPARIN_APP_ENV:-production}_session"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LAPARIN_SEED_CATALOG: "${LAPARIN_SEED_CATALOG:-false}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes:
      - uploads:/var/www/html/storage/app/public

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${LAPARIN_DB_NAME:?Set LAPARIN_DB_NAME}"
      MYSQL_USER: "${LAPARIN_DB_USER:-laparin}"
      MYSQL_PASSWORD: "${LAPARIN_DB_PASSWORD:?Set LAPARIN_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${LAPARIN_DB_ROOT_PASSWORD:?Set LAPARIN_DB_ROOT_PASSWORD}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1
          --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE"
          --batch --skip-column-names --execute="SELECT 1" >/dev/null
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 20
    networks:
      - backend
    volumes:
      - db_data:/var/lib/mysql

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
  uploads:
